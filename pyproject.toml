[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-runloop"
version = "0.3.0"
description = "Explicit, durable agent loop: validated tool calls, human approval, budgets, crash recovery, and composable router / waterfall / parallel / handoff / refine blocks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "KirillOstapenko", email = "djkroq@gmail.com" }]
keywords = ["agent", "LLM", "tool-calling", "openai", "azure-openai", "human-in-the-loop", "router", "multi-agent", "durable", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
trace = ["flow-xray>=0.4.0"]
openai = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/kroq86/agent-loop"
Repository = "https://github.com/kroq86/agent-loop"
Issues = "https://github.com/kroq86/agent-loop/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_loop"]

[tool.hatch.build.targets.sdist]
include = ["agent_loop/**", "tests/**", "README.md", "LICENSE"]
